<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 92" role="img" aria-labelledby="t" style="color:#161311">
  <title id="t">ஆழி (Aazhi) mark: the Tamil letter ழ, its root folded into a paper plane</title>
  <!-- one colour (currentColor). The fold becomes a cut along the crease, so a stamp,
       a laser or an embroidery machine still gets the paper plane. -->
  <defs>
    <mask id="aazhi-crease" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="92">
      <rect width="100" height="92" fill="#fff"/>
      <path d="M38 70.24L101 61.8" stroke="#000" stroke-width="1.8"/>
    </mask>
  </defs>
  <path fill="currentColor" mask="url(#aazhi-crease)" d="M40 62H99.5L40 77.95Z"/>
  <path fill="currentColor" fill-rule="evenodd" d="M0 4.5L13 1V46H38V25.5A25.5 25.5 0 0 1 89 25.5V37A20 20 0 0 1 69 57H51V66A25.5 25.5 0 0 1 0 66V62H13V66A12.5 12.5 0 0 0 38 66V57H0ZM51 46V24A12.5 12.5 0 0 1 76 24V37A9 9 0 0 1 67 46Z"/>
</svg>
