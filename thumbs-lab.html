<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ஆழி · thumbs lab</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--f-body); color: var(--ink); background: var(--paper); }
  header { padding: 28px var(--gutter) 20px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--t-xl); line-height: .88; margin: 0; text-transform: uppercase; }
  h1 span { font-family: var(--f-tamil); font-weight: 900; }
  .meta { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); letter-spacing: .08em; }
  button { font: 700 var(--t-xs)/1 var(--f-narrow); letter-spacing: var(--track-wide); text-transform: uppercase; background: var(--ink); color: var(--paper); border: 0; padding: 10px 14px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--biro); outline-offset: 3px; }

  section { position: relative; padding: 40px var(--gutter) 56px; isolation: isolate; }
  section::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .karai { background: var(--chilli); }
  .karai::after { background-image: var(--fibers); opacity: .7; }
  .muthu { background: linear-gradient(180deg, var(--oxblood) 0%, var(--maroon) 70%, #8a3a2c 100%); }
  .muthu::after { background-image: var(--grain); opacity: .35; mix-blend-mode: overlay; }
  h2 { font-family: var(--f-narrow); font-weight: 700; font-size: var(--t-xs); letter-spacing: var(--track-wide); text-transform: uppercase; margin: 0 0 24px; }
  .karai h2 { color: var(--paper); }
  .muthu h2 { color: var(--paper-2); }

  .grid { display: grid; gap: 36px 28px; max-width: var(--max); margin: 0 auto; }
  .karai .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .muthu .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
  figure { margin: 0; }
  figure:nth-child(3n+1) { transform: rotate(-1.2deg); }
  figure:nth-child(3n+2) { transform: rotate(.8deg); }
  figure:nth-child(3n) { transform: rotate(-.4deg); }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; }
  .karai figcaption { color: var(--paper); }
  .muthu figcaption { color: var(--paper-3); }
  .bad { color: var(--stamp); background: var(--paper); padding: 0 4px; }
  @media (prefers-reduced-motion: reduce) { figure { transform: none !important; } }
</style>
</head>
<body>
<header>
  <h1><span>ஆழி</span> thumbs lab</h1>
  <p class="meta" id="source">loading…</p>
  <button type="button" id="rerender">Re-render all</button>
</header>

<section class="karai" aria-labelledby="h-free">
  <h2 id="h-free">கரை · Karai · free</h2>
  <div class="grid" id="free"></div>
</section>

<section class="muthu" aria-labelledby="h-paid">
  <h2 id="h-paid">முத்துக்குளி · Muthukuli · paid</h2>
  <div class="grid" id="paid"></div>
</section>

<section class="karai" aria-labelledby="h-edge">
  <h2 id="h-edge">Edge cases · missing fields fall back</h2>
  <div class="grid" id="edge-free"></div>
</section>
<section class="muthu" aria-label="Edge cases, paid">
  <div class="grid" id="edge-paid"></div>
</section>

<script type="module">
import { renderThumb } from './js/thumbs.js';

// Fallback samples, used only if js/courses.js is missing or incomplete.
const SAMPLE_FREE = [
  { id: 'f-python', kind: 'free', no: '01', title: 'Python: print() to your first game', titleTa: 'பைத்தான்', thumb: { word: 'Python', accent: 'lavender', motif: 'python' } },
  { id: 'f-git', kind: 'free', no: '02', title: 'Git & GitHub: save-point for your life', titleTa: 'கிட்', thumb: { word: 'Git', accent: 'salmon', motif: 'git' } },
  { id: 'f-dsa', kind: 'free', no: '03', title: 'DSA Patterns: 23 patterns, zero mugging', titleTa: 'டேட்டா அமைப்பு', thumb: { word: 'DSA', accent: 'lavender', motif: 'dsa' } },
  { id: 'f-sql', kind: 'free', no: '04', title: 'Databases with PostgreSQL', titleTa: 'தரவுத்தளம்', thumb: { word: 'SQL', accent: 'salmon', motif: 'sql' } },
  { id: 'f-docker', kind: 'free', no: '05', title: 'Docker + load testing', titleTa: 'டாக்கர்', thumb: { word: 'Docker', accent: 'lavender', motif: 'docker' } },
  { id: 'f-prompt', kind: 'free', no: '06', title: 'Prompt Engineering: talk to AI like a pro', titleTa: 'ப்ராம்ப்ட்', thumb: { word: 'Prompt', accent: 'salmon', motif: 'prompt' } },
];
const SAMPLE_PAID = [
  { id: 'p-backend', kind: 'paid', no: '01', title: 'Muthu 01: Backend → Offer Letter', duration: '~9 months', format: 'Live Tamil classes', thumb: { word: 'Backend', accent: 'stamp', motif: 'backend' }, price: { full: 14999, emi: 1999 }, nextBatch: '16 Nov 2026', seats: 60, seatsLeft: 17, gate: 'GATE 01', row: 'ROW 3', seat: 'SEAT 11' },
  { id: 'p-cloud', kind: 'paid', no: '02', title: 'Muthu 02: Cloud & DevOps', duration: '~6 months', format: 'Weekends + 2 weeknights', thumb: { word: 'Cloud', accent: 'sea', motif: 'cloud' }, price: { full: 11999, emi: 1799 }, nextBatch: '7 Dec 2026', seats: 50, seatsLeft: 31, gate: 'GATE 02', row: 'ROW 5', seat: 'SEAT 04' },
  { id: 'p-ai', kind: 'paid', no: '03', title: 'Muthu 03: AI Agents & Data', duration: '~4 months', format: 'Mon / Wed / Fri nights', thumb: { word: 'AI Agents', accent: 'violet', motif: 'ai' }, price: { full: 12999, emi: 1899 }, nextBatch: '5 Jan 2027', seats: 40, seatsLeft: 9, gate: 'GATE 03', row: 'ROW 1', seat: 'SEAT 07' },
];

let FREE = SAMPLE_FREE, PAID = SAMPLE_PAID, source = 'inline samples (js/courses.js not found)';
try {
  const m = await import('./js/courses.js');
  if (Array.isArray(m.FREE_COURSES) && m.FREE_COURSES.length && Array.isArray(m.PAID_COURSES) && m.PAID_COURSES.length) {
    FREE = m.FREE_COURSES; PAID = m.PAID_COURSES; source = 'js/courses.js';
  } else source = 'inline samples (js/courses.js exports incomplete)';
} catch (err) {
  console.info('[thumbs-lab] js/courses.js unavailable, using samples:', err.message);
}

const EDGE_FREE = [{}, { id: 'f-python' }, { kind: 'free', title: 'Mystery course', thumb: { word: 'Linux Basics', motif: 'unknown', accent: 'violet' } }];
const EDGE_PAID = [{ kind: 'paid' }, { id: 'p-cloud', title: 'Cloud' }];

const checkSvg = (s) => {
  const doc = new DOMParser().parseFromString(s, 'image/svg+xml');
  return !doc.querySelector('parsererror');
};

function fill(el, list) {
  el.replaceChildren(...list.map((c) => {
    const svg = renderThumb(c);
    const fig = document.createElement('figure');
    fig.innerHTML = svg;
    const cap = document.createElement('figcaption');
    const ok = svg.startsWith('<svg') && checkSvg(svg);
    cap.innerHTML = `${(c && c.id) || '(no id)'} · ${(new Blob([svg]).size / 1024).toFixed(1)} KB` + (ok ? '' : ' · <span class="bad">PARSE ERROR</span>');
    fig.append(cap);
    return fig;
  }));
}

function renderAll() {
  fill(document.getElementById('free'), FREE);
  fill(document.getElementById('paid'), PAID);
  fill(document.getElementById('edge-free'), EDGE_FREE);
  fill(document.getElementById('edge-paid'), EDGE_PAID);
  const ids = [...document.querySelectorAll('[id]')].map((n) => n.id);
  const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
  document.getElementById('source').textContent = `data: ${source} · ${ids.length} ids on page · ${dupes.length ? 'DUPLICATE ids: ' + dupes.join(', ') : 'no duplicate ids'}`;
}

renderAll();
document.getElementById('rerender').addEventListener('click', renderAll);
</script>
</body>
</html>
